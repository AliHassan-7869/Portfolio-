<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" rx="40" fill="url(#bg)"/>
  <circle cx="950" cy="180" r="220" fill="rgba(99, 102, 241, 0.08)"/>
  <circle cx="220" cy="620" r="260" fill="rgba(14, 165, 233, 0.08)"/>
  <rect x="160" y="180" width="880" height="460" rx="32" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(148, 163, 184, 0.3)"/>
  
  <!-- Dialogue & Decision Tree Visual -->
  <g opacity="0.95">
    <!-- Bubble 1 -->
    <rect x="280" y="270" width="280" height="110" rx="24" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="4"/>
    <text x="420" y="335" fill="#C7D2FE" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Agent Hypothesis</text>
    
    <!-- Bubble 2 -->
    <rect x="640" y="340" width="280" height="110" rx="24" fill="rgba(14, 165, 233, 0.2)" stroke="#0EA5E9" stroke-width="4"/>
    <text x="780" y="405" fill="#BAE6FD" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Counter-Argument</text>

    <!-- Synthesis Node -->
    <rect x="460" y="480" width="280" height="90" rx="20" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="4"/>
    <text x="600" y="535" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Consensus & Decision</text>

    <path d="M420 380V480H460" stroke="#818CF8" stroke-width="4" stroke-dasharray="6 6"/>
    <path d="M780 450V525H740" stroke="#38BDF8" stroke-width="4" stroke-dasharray="6 6"/>
  </g>

  <text x="200" y="120" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Research Discussion AI</text>
  <text x="200" y="700" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="32">Collaborative Multi-Agent Deliberation & Decision Making</text>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#1A1D2E"/>
    </linearGradient>
  </defs>
</svg>
